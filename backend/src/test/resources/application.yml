spring:
  datasource:
    url: jdbc:h2:mem:zeropay_lunch;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        type:
          preferred_uuid_jdbc_type: CHAR

app:
  time-zone: Asia/Seoul
  ai:
    base-url: http://localhost:8001
    connect-timeout: 2s
    response-timeout: 8s
    max-attempts: 1
    fallback-enabled: true
  komsco:
    base-url: https://example.test/komsco
    service-key: ""
    page-size: 100
    connect-timeout: 1s
    read-timeout: 1s
    import-enabled: false
    replace-existing: false
    scheduler-enabled: false
    scheduler-cron: "0 0 3 * * SUN"
    scheduler-zone: Asia/Seoul
