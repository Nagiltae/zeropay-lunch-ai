spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zeropay_lunch}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:zeropay}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:zeropay_local}}
spring.jpa.open-in-view=false
spring.mvc.async.request-timeout=60000
