spring:
  application:
    name: backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-mysql
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  mvc:
    async:
      request-timeout: 60s

app:
  time-zone: Asia/Seoul
  ai:
    semantic-runtime-enabled: ${AI_SEMANTIC_RUNTIME_ENABLED:false}
    llm-explanation-enabled: ${AI_LLM_EXPLANATION_ENABLED:false}
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    response-timeout: ${AI_RESPONSE_TIMEOUT:8s}
    explanation-timeout: ${AI_EXPLANATION_RESPONSE_TIMEOUT:27s}
    max-attempts: ${AI_MAX_ATTEMPTS:1}
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
  komsco:
    base-url: ${KOMSCO_BASE_URL:https://apis.data.go.kr/B190001/mobileFranchisesV4/mobileV4}
    service-key: ${KOMSCO_SERVICE_KEY:}
    page-size: ${KOMSCO_PAGE_SIZE:1000}
    connect-timeout: ${KOMSCO_CONNECT_TIMEOUT:3s}
    read-timeout: ${KOMSCO_READ_TIMEOUT:20s}
    import-enabled: ${KOMSCO_IMPORT_ENABLED:false}
    replace-existing: ${KOMSCO_REPLACE_EXISTING:false}
    scheduler-enabled: ${KOMSCO_SCHEDULER_ENABLED:false}
    scheduler-cron: "${KOMSCO_SCHEDULER_CRON:0 0 3 * * SUN}"
    scheduler-zone: ${KOMSCO_SCHEDULER_ZONE:Asia/Seoul}
