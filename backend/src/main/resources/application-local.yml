spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zeropay_lunch}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/sample

app:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8001}
