spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:zeropay_lunch}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/sample

app:
  ai:
    base-url: ${AI_BASE_URL:http://ai:8001}
