[project]
name = "zeropay-lunch-ai"
version = "0.1.0"
description = "AI workflow service for ZeroPay Lunch AI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
httpx2 = ">=2.0,<3.0"
pytest = ">=8.0,<9.0"
ruff = ">=0.9,<1.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
