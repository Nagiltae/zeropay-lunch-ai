# Harness Role: 로컬·통합 검증에서 동일한 서비스 토폴로지와 health 조건을 재현한다.
# Agent Usage: Docker 실행 구조나 서비스 의존성을 바꿀 때 읽고 check-integration.sh에서 실행한다.
# Why: 개인 PC의 수동 설정에 따라 결과가 달라지거나 존재하지 않는 의존성을 가정하는 것을 방지한다.
# Connection: .env.example의 변수, 각 Dockerfile, setup.sh와 check-integration.sh를 하나의 실행 환경으로 묶는다.

services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-zeropay_lunch}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-zeropay}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-zeropay_local}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8001}
      AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-2s}
      AI_RESPONSE_TIMEOUT: ${AI_RESPONSE_TIMEOUT:-8s}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-1}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  ai:
    build:
      context: ./ai
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:${AI_PORT:-8001}:8001"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zeropay_lunch}
      MYSQL_USER: ${MYSQL_USER:-zeropay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zeropay_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
  qdrant-data:
